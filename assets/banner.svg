<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace">
  <title id="t">Cancer Genomics to CRISPR Targets — TCGA-LUAD driver analysis and KRAS allele-specific guides</title>
  <desc id="d">Banner showing how correcting mutation counts for gene length re-ranks candidate driver genes: KRAS and KEAP1 rise, TTN and MUC16 fall.</desc>

  <style>
    .ttl{fill:#E6EDF3}.sub{fill:#9AA7B4}.dim{fill:#6B7885}
    .cy{fill:#7FC4DC}.gr{fill:#6FD9A0}.am{fill:#D8B366}.rd{fill:#D4776E}
    .ln{stroke:#FFFFFF;stroke-opacity:.08}
    .pulse{animation:p 3s ease-in-out infinite}@keyframes p{50%{opacity:.4}}
    .rise{animation:r 4s ease-in-out infinite}@keyframes r{0%,100%{opacity:.75}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.pulse,.rise{animation:none}}
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E13"/><stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="hd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131B24"/><stop offset="1" stop-color="#0E141B"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".05"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".015"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="330" rx="16" fill="url(#bg)"/>
  <path d="M16 .5H1184A15.5 15.5 0 0 1 1199.5 16V44H.5V16A15.5 15.5 0 0 1 16 .5Z" fill="url(#hd)"/>
  <line x1="1" y1="44.5" x2="1199" y2="44.5" stroke="#1E2935"/>
  <rect x=".5" y=".5" width="1199" height="329" rx="15.5" fill="none" stroke="#1E2935"/>

  <circle cx="28" cy="22" r="5" fill="#D4776E" fill-opacity=".72"/>
  <circle cx="45" cy="22" r="5" fill="#D8B366" fill-opacity=".72"/>
  <circle cx="62" cy="22" r="5" fill="#6FBF8A" fill-opacity=".72"/>
  <text x="88" y="26.5" font-size="12.5" class="dim">mhommii / cancer-crispr-targets</text>
  <circle cx="948" cy="22" r="3.5" class="cy pulse"/>
  <text x="1160" y="26" text-anchor="end" font-size="11.5" class="cy" letter-spacing=".06em">TCGA-LUAD · 517 PATIENTS</text>

  <!-- Title -->
  <text x="40" y="96" font-size="30" font-weight="700" class="ttl">Cancer → CRISPR Targets</text>
  <text x="40" y="124" font-size="14" class="sub">From tumour mutation data to allele-specific guide candidates</text>
  <text x="40" y="146" font-size="13" class="dim">TCGA-LUAD (MC3) · maftools · KRAS G12 hotspot</text>

  <g transform="translate(40,170)">
    <rect x="0" y="0" width="30" height="22" rx="5" fill="#7FC4DC" fill-opacity=".08" stroke="#7FC4DC" stroke-opacity=".3"/>
    <text x="15" y="15.5" font-size="11" text-anchor="middle" class="cy">R</text>
    <rect x="38" y="0" width="70" height="22" rx="5" fill="#7FC4DC" fill-opacity=".08" stroke="#7FC4DC" stroke-opacity=".3"/>
    <text x="73" y="15.5" font-size="11" text-anchor="middle" class="cy">maftools</text>
    <rect x="116" y="0" width="58" height="22" rx="5" fill="#7FC4DC" fill-opacity=".08" stroke="#7FC4DC" stroke-opacity=".3"/>
    <text x="145" y="15.5" font-size="11" text-anchor="middle" class="cy">Python</text>
    <rect x="182" y="0" width="52" height="22" rx="5" fill="#7FC4DC" fill-opacity=".08" stroke="#7FC4DC" stroke-opacity=".3"/>
    <text x="208" y="15.5" font-size="11" text-anchor="middle" class="cy">TCGA</text>
  </g>

  <!-- Rank-shift diagram: the project's central finding -->
  <rect x="556.5" y="60.5" width="604" height="148" rx="10" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".1"/>
  <text x="578" y="82" font-size="10.5" class="cy" letter-spacing=".16em">CORRECTING FOR GENE LENGTH RE-RANKS THE CANDIDATES</text>

  <text x="640" y="104" font-size="10" text-anchor="middle" class="dim">by frequency</text>
  <text x="1010" y="104" font-size="10" text-anchor="middle" class="dim">per kb of CDS</text>

  <!-- rising: real drivers -->
  <g class="rise">
    <text x="600" y="128" font-size="12.5" class="dim">9th</text>
    <line x1="638" y1="124" x2="948" y2="124" stroke="#6FD9A0" stroke-opacity=".55" stroke-width="1.4"/>
    <path d="M948 120 L958 124 L948 128 Z" fill="#6FD9A0"/>
    <text x="968" y="128" font-size="13" font-weight="700" class="gr">1st</text>
    <text x="1010" y="128" font-size="13" font-weight="700" class="gr">KRAS</text>

    <text x="596" y="152" font-size="12.5" class="dim">22nd</text>
    <line x1="638" y1="148" x2="948" y2="148" stroke="#6FD9A0" stroke-opacity=".4" stroke-width="1.4"/>
    <path d="M948 144 L958 148 L948 152 Z" fill="#6FD9A0" fill-opacity=".8"/>
    <text x="968" y="152" font-size="13" font-weight="700" class="gr">3rd</text>
    <text x="1010" y="152" font-size="13" font-weight="600" class="gr">KEAP1</text>
  </g>

  <line x1="578" y1="164.5" x2="1138" y2="164.5" class="ln" stroke-dasharray="2 4"/>

  <!-- falling: length artefacts -->
  <text x="600" y="186" font-size="12.5" class="dim">2nd</text>
  <line x1="638" y1="182" x2="948" y2="182" stroke="#D4776E" stroke-opacity=".45" stroke-width="1.4"/>
  <path d="M948 178 L958 182 L948 186 Z" fill="#D4776E" fill-opacity=".85"/>
  <text x="966" y="186" font-size="13" font-weight="700" class="rd">25th</text>
  <text x="1010" y="186" font-size="13" font-weight="600" class="rd">TTN</text>
  <text x="1060" y="186" font-size="10" class="dim">108 kb CDS</text>

  <text x="600" y="200" font-size="11" class="dim">3rd</text>
  <line x1="638" y1="197" x2="948" y2="197" stroke="#D4776E" stroke-opacity=".3" stroke-width="1.2"/>
  <path d="M948 193.5 L957 197 L948 200.5 Z" fill="#D4776E" fill-opacity=".6"/>
  <text x="966" y="200" font-size="11" class="rd">23rd</text>
  <text x="1010" y="200" font-size="11" class="rd">MUC16</text>
  <text x="1060" y="200" font-size="10" class="dim">46 kb CDS</text>

  <line x1="40" y1="230.5" x2="1160" y2="230.5" class="ln"/>

  <!-- Stats -->
  <g transform="translate(40,262)">
    <text x="0" y="0" font-size="26" font-weight="700" class="ttl">142,829</text>
    <text x="0" y="22" font-size="11" class="dim">somatic mutations analysed</text>

    <text x="264" y="0" font-size="26" font-weight="700" class="cy">50.7%</text>
    <text x="264" y="22" font-size="11" class="dim">of patients carry TP53 mutation</text>

    <text x="560" y="0" font-size="26" font-weight="700" class="gr">152/161</text>
    <text x="560" y="22" font-size="11" class="dim">KRAS mutations in one cluster</text>

    <text x="856" y="0" font-size="26" font-weight="700" class="am">12</text>
    <text x="856" y="22" font-size="11" class="dim">allele-specific guide candidates</text>
  </g>
</svg>
